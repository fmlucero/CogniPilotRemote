# CogniPilot — stack en la VM UM-Cloud
# Se accede desde la PC via ZeroTier: http://10.201.0.67:3000

services:
  postgres:
    image: postgres:16-alpine
    container_name: cognipilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cognipilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cognipilot
    ports:
      # Expuesto a la red interna de la VM solo. El SG cierra desde fuera.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognipilot -d cognipilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognipilot-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cognipilot:${POSTGRES_PASSWORD}@postgres:5432/cognipilot?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      NODE_ENV: production
      # Solo usadas por `npm run prisma:seed`
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_SUPERVISOR_PASSWORD: ${SEED_SUPERVISOR_PASSWORD}
      SEED_GERENTE_PASSWORD: ${SEED_GERENTE_PASSWORD}
      SEED_REPARTIDOR_PASSWORD: ${SEED_REPARTIDOR_PASSWORD}
    ports:
      - "3000:3000"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cognipilot-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin_data:
