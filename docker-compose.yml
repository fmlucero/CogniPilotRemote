# CogniPilot Front — solo UI (post-cutover a FastAPI)
#
# Este compose mantiene SOLO el front Next.js (`app`) + Postgres + pgAdmin.
# El back API ahora vive en cognipilot-back (FastAPI). El front llama al back
# via host.docker.internal:8001 (modo paralelo) o via nginx en :80 (recomendado).
#
# Acceso recomendado: a través del nginx de cognipilot-back en :80, que rutea
# /api/* al back FastAPI y / al front Next.js.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cognipilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cognipilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cognipilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognipilot -d cognipilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognipilot-app
    restart: unless-stopped
    environment:
      # Los Server Components hacen fetch al back FastAPI corriendo en
      # cognipilot-back. host.docker.internal apunta al host (la VM), donde
      # back-api está expuesto en :8001 por el otro compose.
      BACK_API_URL: ${BACK_API_URL:-http://host.docker.internal:8001}
      # JWT_SECRET sigue siendo necesario para que lib/auth.ts pueda VERIFICAR
      # la cookie cp_at (mismo secret que FastAPI). El front ya no firma.
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    extra_hosts:
      # Para resolver host.docker.internal en Linux (Docker no lo agrega
      # automáticamente fuera de Docker Desktop).
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cognipilot-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin_data:
